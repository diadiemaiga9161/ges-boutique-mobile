<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" [text]="'COMMON.BACK' | translate"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="notifications.length > 0" (click)="toutLire()" fill="clear">
        <ion-icon name="checkmark-done-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="nt-content">

  <app-activer-notifications mode="reglage"></app-activer-notifications>

  <!-- Bandeau héros : compteur non lues (≡ NotificationsScreen RN) -->
  <div class="nt-hero" *ngIf="!isLoading && notifications.length > 0">
    <div class="nt-hero__deco"></div>
    <p class="nt-hero__eyebrow">Non lues</p>
    <p class="nt-hero__value">{{ notifications.length }}</p>
  </div>

  <!-- Skeleton pendant le chargement -->
  <div class="sk-list nt-body" *ngIf="isLoading">
    <div class="sk-card" *ngFor="let i of [1,2,3,4,5]">
      <div class="skeleton sk-square"></div>
      <div class="sk-card-body">
        <div class="skeleton sk-line sk-line--w80"></div>
        <div class="skeleton sk-line sk-line--w50 sk-line--sm"></div>
      </div>
    </div>
  </div>

  <!-- Liste des notifications -->
  <section class="nt-body" *ngIf="!isLoading && notifications.length > 0">
    <div class="nt-toolbar">
      <button type="button" class="nt-read-all" (click)="toutLire()">
        <ion-icon name="checkmark-done-outline"></ion-icon>
        Tout marquer comme lu
      </button>
    </div>

    <button type="button" class="nt-card nt-card--unread"
            *ngFor="let n of notifications; trackBy: trackById"
            (click)="cliquer(n)">
      <div class="nt-icon" [ngClass]="'nt-icon--' + couleur(n.type)">
        <ion-icon [name]="icone(n.type)"></ion-icon>
      </div>
      <div class="nt-info">
        <p class="nt-title">{{ n.titre }}</p>
        <p class="nt-message">{{ n.message }}</p>
        <div class="nt-meta">
          <span class="nt-pill" [ngClass]="'nt-pill--' + couleur(n.type)">{{ n.type.replace('_', ' ') }}</span>
          <span class="nt-date">{{ n.dateCreation | date:'dd/MM HH:mm' }}</span>
        </div>
      </div>
      <span class="nt-dot" aria-hidden="true"></span>
    </button>
  </section>

  <!-- État vide -->
  <gl-empty-state
    *ngIf="!isLoading && notifications.length === 0"
    icon="notifications-off-outline"
    title="Aucune notification"
    message="Vous êtes à jour, aucune notification non lue">
  </gl-empty-state>

</ion-content>
