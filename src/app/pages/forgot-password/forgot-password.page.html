<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Mot de passe oublié</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="fp-content ion-padding">
  <div class="fp-wrapper">

    <!-- Bloc icône / titre -->
    <div class="fp-hero">
      <div class="fp-hero__icon">
        <ion-icon name="lock-open-outline"></ion-icon>
      </div>
      <h2 class="fp-hero__title">Réinitialisation</h2>
      <p class="fp-hero__sub">
        Entrez votre e-mail. Vous recevrez un lien pour créer un nouveau mot de passe.
      </p>
    </div>

    <!-- Succès -->
    <div class="fp-card fp-card--success anim-fade-up" *ngIf="successMessage">
      <div class="fp-status-icon fp-status-icon--success">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3 class="fp-status-title">{{ successMessage }}</h3>
      <p class="fp-status-text">Vérifiez votre boîte mail (et les spams).</p>
      <button type="button" class="fp-submit" (click)="retourConnexion()">
        <span>
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </span>
      </button>
    </div>

    <!-- Formulaire -->
    <div class="fp-card anim-fade-up" *ngIf="!successMessage">

      <div class="fp-error" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="input-group">
        <label class="input-label">
          <ion-icon name="mail-outline"></ion-icon>
          Adresse e-mail
        </label>
        <div class="input-wrap">
          <ion-input
            class="input-field"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="exemple@mail.com"
            autocomplete="email">
          </ion-input>
        </div>
      </div>

      <button type="button" class="fp-submit" (click)="submit()" [disabled]="isLoading">
        <span *ngIf="!isLoading">
          <ion-icon name="paper-plane-outline"></ion-icon>
          Envoyer le lien
        </span>
        <span *ngIf="isLoading" class="fp-submit__loading">
          <ion-spinner name="crescent"></ion-spinner>
          Envoi en cours...
        </span>
      </button>

      <div class="ion-text-center fp-back">
        <button type="button" class="fp-link-btn" (click)="retourConnexion()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </button>
      </div>
    </div>

  </div>
</ion-content>
