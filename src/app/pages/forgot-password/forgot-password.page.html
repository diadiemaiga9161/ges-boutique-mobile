<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Mot de passe oublié</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="au-content">
  <div class="au-wrapper">

    <!-- ══ Bandeau dégradé (même langage que la connexion) ══ -->
    <div class="au-hero">
      <div class="au-deco au-deco--1"></div>
      <div class="au-deco au-deco--2"></div>
      <div class="au-hero__body">
        <div class="au-hero__icon">
          <ion-icon name="lock-open-outline"></ion-icon>
        </div>
        <h1 class="au-hero__title">Réinitialisation</h1>
        <p class="au-hero__sub">
          Entrez votre e-mail. Vous recevrez un lien pour créer un nouveau mot de passe.
        </p>
      </div>
      <div class="au-wave">
        <svg viewBox="0 0 375 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path class="au-wave-path" d="M0,20 C60,50 120,0 200,25 C270,48 330,5 375,25 L375,60 L0,60 Z"/>
        </svg>
      </div>
    </div>

    <div class="au-zone">

      <!-- Succès -->
      <div class="au-card au-card--center anim-fade-up" *ngIf="successMessage">
        <div class="au-status au-status--ok">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2 class="au-status__title">{{ successMessage }}</h2>
        <p class="au-status__text">Vérifiez votre boîte mail (et les spams).</p>
        <button type="button" class="au-submit" (click)="retourConnexion()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </button>
      </div>

      <!-- Formulaire -->
      <div class="au-card anim-fade-up" *ngIf="!successMessage">

        <div class="au-error" *ngIf="errorMessage">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="input-group">
          <label class="input-label">
            <ion-icon name="mail-outline"></ion-icon>
            Adresse e-mail
          </label>
          <div class="input-wrap">
            <ion-input
              class="input-field"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="exemple@mail.com"
              autocomplete="email">
            </ion-input>
          </div>
        </div>

        <button type="button" class="au-submit" (click)="submit()" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            <ion-icon name="paper-plane-outline"></ion-icon>
            Envoyer le lien
          </span>
          <span *ngIf="isLoading" class="au-submit__loading">
            <ion-spinner name="crescent"></ion-spinner>
            Envoi en cours...
          </span>
        </button>

        <button type="button" class="au-link" (click)="retourConnexion()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </button>
      </div>

    </div>
  </div>
</ion-content>
