<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/sales" [text]="'COMMON.BACK' | translate"></ion-back-button>
    </ion-buttons>
    <ion-title>Boutiques partenaires</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ct-content">
  <div class="page-pad stack">

    <!-- Chargement -->
    <div class="sk-list" *ngIf="isLoading">
      <div class="sk-card" *ngFor="let i of [1,2,3]">
        <div class="skeleton sk-square"></div>
        <div class="sk-card-body">
          <div class="skeleton sk-line sk-line--w60"></div>
          <div class="skeleton sk-line sk-line--w80 sk-line--sm"></div>
        </div>
        <div class="skeleton sk-line sk-line--w20"></div>
      </div>
    </div>

    <!-- Liste vide -->
    <gl-empty-state
      *ngIf="!isLoading && partenaires.length === 0 && !afficherForm"
      icon="business-outline"
      title="Aucune boutique partenaire"
      ctaLabel="Ajouter une boutique"
      (ctaClick)="nouveau()">
    </gl-empty-state>

    <!-- Liste des partenaires -->
    <section class="stack animate-cards" *ngIf="!isLoading && partenaires.length > 0">
      <article class="gl-list-card" *ngFor="let p of partenaires">
        <div class="glc-body">
          <div class="glc-head">
            <div class="glc-icon" [class.glc-icon--info]="p.actif" [class.glc-icon--neutral]="!p.actif">
              <ion-icon name="storefront-outline"></ion-icon>
            </div>
            <div class="glc-info">
              <p class="glc-title">{{ p.nom }}</p>
              <p class="glc-sub glc-sub--url">
                <ion-icon name="link-outline"></ion-icon>
                <span>{{ p.url }}</span>
              </p>
            </div>
            <span class="gl-pill" [class.gl-pill--ok]="p.actif" [class.gl-pill--neutral]="!p.actif">
              {{ p.actif ? 'Actif' : 'Inactif' }}
            </span>
          </div>
        </div>

        <!-- Actions écrites en pied de carte (anciennes options de glissement, mêmes handlers) -->
        <div class="glc-actions">
          <button type="button" class="glc-action glc-action--link" (click)="editer(p)">
            <ion-icon name="create-outline"></ion-icon>
            <span>Modifier</span>
          </button>
          <button type="button" class="glc-action glc-action--bad" (click)="confirmerSuppression(p)">
            <ion-icon name="trash-outline"></ion-icon>
            <span>Supprimer</span>
          </button>
        </div>
      </article>
    </section>

  </div>
</ion-content>

<!-- Bouton flottant étendu : ajout (même action que l'ancien bouton « + » de l'en-tête) -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <button type="button" class="gl-fab-extended" (click)="nouveau()">
    <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    Ajouter une boutique
  </button>
</ion-fab>

<!-- ══════════════════════════════════════════════════════════════════════
     MODALE AJOUT / MODIFICATION (centrée)
══════════════════════════════════════════════════════════════════════ -->
<div class="md-overlay" *ngIf="afficherForm">
  <div class="md-backdrop" (click)="annuler()"></div>
  <div class="md-sheet" role="dialog" aria-modal="true">

    <div class="md-header">
      <div class="md-icon md-icon--info">
        <ion-icon [name]="editing ? 'create-outline' : 'storefront-outline'"></ion-icon>
      </div>
      <h2 class="md-title">{{ editing ? 'Modifier partenaire' : 'Nouveau partenaire' }}</h2>
      <button type="button" class="md-close" (click)="annuler()" aria-label="Fermer">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <div class="md-body">
      <section class="md-section">
        <p class="md-section-title"><ion-icon name="storefront-outline"></ion-icon> Boutique</p>

        <label class="md-field">
          <span>Nom de la boutique</span>
          <div class="md-input">
            <input [(ngModel)]="form.nom" placeholder="Ex: Boutique Centre-ville" />
            <button type="button" class="md-input__clear" *ngIf="form.nom" (click)="form.nom = ''" aria-label="Effacer">
              <ion-icon name="close-circle-outline"></ion-icon>
            </button>
          </div>
        </label>

        <label class="md-field">
          <span>URL de l'API (ex: http://192.168.1.10:8082)</span>
          <div class="md-input">
            <input [(ngModel)]="form.url" placeholder="http://..." type="url" autocapitalize="off" autocomplete="off" />
            <button type="button" class="md-input__clear" *ngIf="form.url" (click)="form.url = ''" aria-label="Effacer">
              <ion-icon name="close-circle-outline"></ion-icon>
            </button>
          </div>
        </label>

        <div class="md-toggle-row">
          <span>Boutique active</span>
          <ion-toggle [(ngModel)]="form.actif" aria-label="Boutique active"></ion-toggle>
        </div>
      </section>
    </div>

    <div class="md-footer">
      <button type="button" class="gl-btn gl-btn--secondary" (click)="annuler()">Annuler</button>
      <button type="button" class="gl-btn gl-btn--primary" (click)="sauvegarder()" [disabled]="!form.nom || !form.url">
        <ion-icon name="checkmark-outline"></ion-icon>
        {{ editing ? 'Modifier' : 'Ajouter' }}
      </button>
    </div>

  </div>
</div>
