<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Sorties Stock</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="charger($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="page-pad stack sorties-page">

    <!-- KPI (tuiles 2 colonnes, design commun) -->
    <div class="kpi-grid">
      <gl-stat-card
        icon="arrow-up-circle-outline"
        label="Sorties"
        [value]="sortiesFiltrees.length + ''"
        variant="blue">
      </gl-stat-card>
      <gl-stat-card
        icon="cube-outline"
        label="Unités sorties"
        [value]="totalQuantite() + ''"
        variant="red">
      </gl-stat-card>
    </div>

    <!-- Carte de filtres : recherche + période + type + dates -->
    <div class="filter-zone">
      <div class="fz-search">
        <ion-icon name="search-outline" class="fz-icon"></ion-icon>
        <input class="fz-input" [(ngModel)]="searchTerm" (input)="appliquerFiltres()" placeholder="Produit, motif, utilisateur..." />
        <button class="fz-clear" *ngIf="searchTerm" (click)="searchTerm = ''; appliquerFiltres()" aria-label="Effacer">
          <ion-icon name="close-circle-outline"></ion-icon>
        </button>
      </div>

      <div class="fz-chips">
        <button class="fz-chip" [class.fz-chip--active]="selectedPeriod === 'today'" (click)="filterByPeriod('today')">Aujourd'hui</button>
        <button class="fz-chip" [class.fz-chip--active]="selectedPeriod === 'week'" (click)="filterByPeriod('week')">Semaine</button>
        <button class="fz-chip" [class.fz-chip--active]="selectedPeriod === 'month'" (click)="filterByPeriod('month')">Mois</button>
      </div>

      <div class="fz-chips">
        <button class="fz-chip" [class.fz-chip--active]="typeSortieFilter === ''" (click)="typeSortieFilter = ''; appliquerFiltres()">
          <ion-icon name="list-outline"></ion-icon> Tous ({{ sorties.length }})
        </button>
        <button class="fz-chip" *ngFor="let t of typesSortie"
          [class.fz-chip--active]="typeSortieFilter === t.value"
          (click)="typeSortieFilter = t.value; appliquerFiltres()">
          <ion-icon [name]="iconeTypeSortie(t.value)"></ion-icon> {{ t.label }} ({{ countByType(t.value) }})
        </button>
      </div>

      <div class="fz-dates">
        <label class="gl-field">
          <span class="gl-field__label">Du</span>
          <input type="date" [(ngModel)]="dateDebut" (change)="selectedPeriod = 'custom'; charger()" />
        </label>
        <label class="gl-field">
          <span class="gl-field__label">Au</span>
          <input type="date" [(ngModel)]="dateFin" (change)="selectedPeriod = 'custom'; charger()" />
        </label>
      </div>
    </div>

    <!-- Chargement -->
    <div class="sk-list" *ngIf="loading">
      <div class="sk-card" *ngFor="let i of [1,2,3,4]">
        <div class="skeleton sk-avatar"></div>
        <div class="sk-card-body">
          <div class="skeleton sk-line sk-line--w80"></div>
          <div class="skeleton sk-line sk-line--w50 sk-line--sm"></div>
        </div>
        <div class="skeleton sk-line sk-line--w30"></div>
      </div>
    </div>

    <gl-section-header *ngIf="!loading" [title]="'Résultats · ' + sortiesFiltrees.length"></gl-section-header>

    <section class="stack animate-cards" *ngIf="!loading && sortiesFiltrees.length">
      <article class="gl-list-card" *ngFor="let s of sortiesFiltrees; trackBy: trackById">
        <div class="glc-body">
          <div class="glc-head">
            <div class="glc-icon" [ngClass]="'glc-icon--' + toneTypeSortie(s.typeSortie || '')">
              <ion-icon [name]="iconeTypeSortie(s.typeSortie || '')"></ion-icon>
            </div>
            <div class="glc-info">
              <p class="glc-title">{{ s.produit?.nom || 'Produit' }}</p>
              <p class="glc-sub">{{ formatDate(s.dateMouvement) }}</p>
            </div>
            <div class="glc-right">
              <p class="glc-amount glc-amount--bad">-{{ s.quantite }}</p>
              <span class="gl-pill" [ngClass]="'gl-pill--' + toneTypeSortie(s.typeSortie || '')">
                {{ inventaireService.getTypeSortieLabel(s.typeSortie || 'AUTRE') }}
              </span>
            </div>
          </div>

          <div class="glc-meta">
            <span class="glc-meta__item">
              <ion-icon name="swap-horizontal-outline"></ion-icon>
              {{ s.quantiteAvant }} → {{ s.quantiteApres }}
            </span>
            <span class="glc-meta__item" *ngIf="s.utilisateur?.nomComplet">
              <ion-icon name="person-outline"></ion-icon>
              {{ s.utilisateur?.nomComplet }}
            </span>
          </div>

          <p class="glc-note" *ngIf="s.motif">{{ s.motif }}</p>
        </div>
      </article>
    </section>

    <gl-empty-state
      *ngIf="!loading && !sortiesFiltrees.length"
      icon="arrow-up-circle-outline"
      title="Aucune sortie"
      message="Aucune sortie pour les filtres sélectionnés">
    </gl-empty-state>

  </div>
</ion-content>
