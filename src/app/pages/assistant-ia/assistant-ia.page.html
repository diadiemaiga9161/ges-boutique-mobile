<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Assistant IA</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nouvelleConversation()" title="Nouvelle conversation" aria-label="Nouvelle conversation">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false" class="ai-content">
  <div class="ai-page">

    <!-- ═══════════ Conversation ═══════════ -->
    <div #messagesContainer class="ai-messages">

      <div *ngFor="let msg of messages"
           class="ai-row"
           [class.ai-row--user]="msg.role === 'user'"
           [class.ai-row--assistant]="msg.role === 'assistant'">
        <div class="ai-bubble"
             [class.ai-bubble--user]="msg.role === 'user'"
             [class.ai-bubble--assistant]="msg.role === 'assistant'">{{ msg.texte }}</div>
        <span class="ai-time">{{ msg.heure }}</span>
      </div>

      <!-- L'assistant écrit… -->
      <div *ngIf="loading" class="ai-row ai-row--assistant" aria-live="polite">
        <div class="ai-bubble ai-bubble--assistant ai-typing">
          <ion-spinner name="dots"></ion-spinner>
          <span>L'assistant écrit…</span>
        </div>
      </div>

    </div>

    <!-- ═══════════ Pied collé en bas : suggestions + saisie ═══════════ -->
    <div class="ai-footer">

      <!-- Suggestions en puces (conversation vierge) -->
      <div *ngIf="afficherQuestions && !loading" class="ai-suggestions">
        <p class="ai-suggestions__label">Suggestions</p>
        <div class="fz-chips">
          <button type="button" class="fz-chip" *ngFor="let q of questionsPredefinies" (click)="poserQuestionPredefinies(q.id)">
            <ion-icon [name]="q.icone"></ion-icon>
            {{ q.label }}
          </button>
        </div>
      </div>

      <!-- Zone de saisie -->
      <div class="ai-input-bar">
        <input
          class="ai-input"
          type="text"
          [(ngModel)]="texteLibre"
          placeholder="Posez votre question..."
          aria-label="Posez votre question"
          (keyup.enter)="envoyerTexteLibre()" />
        <button type="button" class="ai-send" [disabled]="!texteLibre.trim() || loading" (click)="envoyerTexteLibre()" aria-label="Envoyer">
          <ion-icon name="send-outline"></ion-icon>
        </button>
      </div>

    </div>

  </div>
</ion-content>
