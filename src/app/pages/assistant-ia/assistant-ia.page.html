<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="sparkles-outline" class="ai-title-icon"></ion-icon>
      Assistant IA
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nouvelleConversation()" title="Nouvelle conversation">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ai-chat-page">

    <!-- Zone messages -->
    <div #messagesContainer class="ai-chat-messages">

      <!-- Messages -->
      <div *ngFor="let msg of messages"
           class="ai-msg-row"
           [class.ai-msg-row--user]="msg.role === 'user'"
           [class.ai-msg-row--assistant]="msg.role === 'assistant'">
        <div class="ai-msg-group">
          <div class="ai-bubble"
               [class.ai-bubble--user]="msg.role === 'user'"
               [class.ai-bubble--assistant]="msg.role === 'assistant'">
            {{ msg.texte }}
          </div>
          <div class="ai-msg-time">{{ msg.heure }}</div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="loading" class="ai-msg-row ai-msg-row--assistant">
        <div class="ai-typing-bubble">
          <ion-spinner name="dots"></ion-spinner>
        </div>
      </div>

    </div>

    <!-- Questions prédéfinies -->
    <div *ngIf="afficherQuestions && !loading" class="ai-suggestions">
      <div class="ai-suggestions__label">Suggestions :</div>
      <div class="ai-suggestions__list">
        <ion-chip *ngFor="let q of questionsPredefinies"
                  (click)="poserQuestionPredefinies(q.id)"
                  color="primary" outline="true">
          <ion-icon [name]="q.icone"></ion-icon>
          {{ q.label }}
        </ion-chip>
      </div>
    </div>

    <!-- Zone saisie -->
    <div class="ai-input-bar">
      <div class="ai-input-wrap">
        <ion-input
          class="ai-input"
          [(ngModel)]="texteLibre"
          placeholder="Posez votre question..."
          (keyup.enter)="envoyerTexteLibre()">
        </ion-input>
      </div>
      <ion-button class="ai-send-btn" shape="round" [disabled]="!texteLibre.trim() || loading" (click)="envoyerTexteLibre()">
        <ion-icon name="send-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

  </div>
</ion-content>
