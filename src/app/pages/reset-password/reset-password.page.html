<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Nouveau mot de passe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="au-content">
  <div class="au-wrapper">

    <!-- ══ Bandeau dégradé (même langage que la connexion) ══ -->
    <div class="au-hero">
      <div class="au-deco au-deco--1"></div>
      <div class="au-deco au-deco--2"></div>
      <div class="au-hero__body">
        <div class="au-hero__icon">
          <ion-icon name="key-outline"></ion-icon>
        </div>
        <h1 class="au-hero__title">Créer un nouveau mot de passe</h1>
      </div>
      <div class="au-wave">
        <svg viewBox="0 0 375 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path class="au-wave-path" d="M0,20 C60,50 120,0 200,25 C270,48 330,5 375,25 L375,60 L0,60 Z"/>
        </svg>
      </div>
    </div>

    <div class="au-zone">

      <!-- Token invalide -->
      <div class="au-card au-card--center anim-fade-up" *ngIf="tokenValide === false">
        <div class="au-status au-status--bad">
          <ion-icon name="close-circle-outline"></ion-icon>
        </div>
        <h2 class="au-status__title">Lien invalide ou expiré</h2>
        <p class="au-status__text">Ce lien n'est plus valide. Veuillez refaire une demande.</p>
        <button type="button" class="au-submit" routerLink="/forgot-password">
          <ion-icon name="refresh-outline"></ion-icon>
          Nouvelle demande
        </button>
      </div>

      <!-- Succès -->
      <div class="au-card au-card--center anim-fade-up" *ngIf="successMessage">
        <div class="au-status au-status--ok">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2 class="au-status__title">{{ successMessage }}</h2>
        <p class="au-status__text">Redirection vers la connexion dans 3 secondes...</p>
      </div>

      <!-- Formulaire -->
      <div class="au-card anim-fade-up" *ngIf="tokenValide && !successMessage">

        <div class="au-error" *ngIf="errorMessage">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="input-group">
          <label class="input-label">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Nouveau mot de passe
          </label>
          <div class="input-wrap">
            <ion-input
              class="input-field"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="Minimum 6 caractères"
              autocomplete="new-password">
            </ion-input>
            <button type="button" class="eye-toggle" (click)="showPassword = !showPassword" aria-label="Nouveau mot de passe">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Confirmer le mot de passe
          </label>
          <div class="input-wrap">
            <ion-input
              class="input-field"
              [type]="showConfirm ? 'text' : 'password'"
              [(ngModel)]="confirm"
              name="confirm"
              placeholder="Répéter le mot de passe"
              autocomplete="new-password">
            </ion-input>
            <button type="button" class="eye-toggle" (click)="showConfirm = !showConfirm" aria-label="Confirmer le mot de passe">
              <ion-icon [name]="showConfirm ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <button type="button" class="au-submit" (click)="submit()" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            <ion-icon name="checkmark-outline"></ion-icon>
            Modifier le mot de passe
          </span>
          <span *ngIf="isLoading" class="au-submit__loading">
            <ion-spinner name="crescent"></ion-spinner>
            Enregistrement...
          </span>
        </button>

        <button type="button" class="au-link" (click)="retourConnexion()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </button>
      </div>

      <!-- Chargement validation token -->
      <div class="au-card au-card--center anim-fade-up" *ngIf="tokenValide === null">
        <ion-spinner name="crescent" class="au-spinner"></ion-spinner>
        <p class="au-status__text au-status__text--flat">Vérification du lien...</p>
      </div>

    </div>
  </div>
</ion-content>
