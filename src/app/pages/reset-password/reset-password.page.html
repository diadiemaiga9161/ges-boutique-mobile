<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Nouveau mot de passe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="rp-content ion-padding">
  <div class="rp-wrapper">

    <!-- Token invalide -->
    <div class="rp-card rp-card--center anim-fade-up" *ngIf="tokenValide === false">
      <div class="rp-status-icon rp-status-icon--danger">
        <ion-icon name="close-circle-outline"></ion-icon>
      </div>
      <h3 class="rp-status-title">Lien invalide ou expiré</h3>
      <p class="rp-status-text">Ce lien n'est plus valide. Veuillez refaire une demande.</p>
      <button type="button" class="rp-submit" routerLink="/forgot-password">
        <span>
          <ion-icon name="refresh-outline"></ion-icon>
          Nouvelle demande
        </span>
      </button>
    </div>

    <!-- Succès -->
    <div class="rp-card rp-card--center anim-fade-up" *ngIf="successMessage">
      <div class="rp-status-icon rp-status-icon--success">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3 class="rp-status-title">{{ successMessage }}</h3>
      <p class="rp-status-text">Redirection vers la connexion dans 3 secondes...</p>
    </div>

    <!-- Formulaire -->
    <div class="rp-card anim-fade-up" *ngIf="tokenValide && !successMessage">

      <div class="rp-hero">
        <div class="rp-hero__icon">
          <ion-icon name="key-outline"></ion-icon>
        </div>
        <h2 class="rp-hero__title">Créer un nouveau mot de passe</h2>
      </div>

      <div class="rp-error" *ngIf="errorMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="input-group">
        <label class="input-label">
          <ion-icon name="lock-closed-outline"></ion-icon>
          Nouveau mot de passe
        </label>
        <div class="input-wrap">
          <ion-input
            class="input-field"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Minimum 6 caractères">
          </ion-input>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">
          <ion-icon name="lock-closed-outline"></ion-icon>
          Confirmer le mot de passe
        </label>
        <div class="input-wrap">
          <ion-input
            class="input-field"
            type="password"
            [(ngModel)]="confirm"
            name="confirm"
            placeholder="Répéter le mot de passe">
          </ion-input>
        </div>
      </div>

      <button type="button" class="rp-submit" (click)="submit()" [disabled]="isLoading">
        <span *ngIf="!isLoading">
          <ion-icon name="checkmark-outline"></ion-icon>
          Modifier le mot de passe
        </span>
        <span *ngIf="isLoading" class="rp-submit__loading">
          <ion-spinner name="crescent"></ion-spinner>
          Enregistrement...
        </span>
      </button>

      <div class="ion-text-center rp-back">
        <button type="button" class="rp-link-btn" (click)="retourConnexion()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </button>
      </div>
    </div>

    <!-- Chargement validation token -->
    <div class="rp-card rp-card--center anim-fade-up" *ngIf="tokenValide === null">
      <ion-spinner name="crescent" class="rp-loading-spinner"></ion-spinner>
      <p class="rp-status-text">Vérification du lien...</p>
    </div>

  </div>
</ion-content>
