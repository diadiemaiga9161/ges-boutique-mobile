<ion-progress-bar type="indeterminate" *ngIf="loadingService.loading$ | async" style="position:fixed;top:0;left:0;right:0;z-index:9999;"></ion-progress-bar>
<ion-tabs>
  <ion-tab-bar slot="bottom">

    <!-- Accueil — tous -->
    <ion-tab-button tab="home" class="tab-btn">
      <div class="tab-icon-wrap">
        <ion-icon name="home-outline"></ion-icon>
      </div>
      <ion-label>{{ 'NAV.HOME' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Ventes (historique) — tous -->
    <ion-tab-button tab="sales" class="tab-btn">
      <div class="tab-icon-wrap">
        <ion-icon name="receipt-outline"></ion-icon>
      </div>
      <ion-label>{{ 'NAV.SALES' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Produits — tous -->
    <ion-tab-button tab="products" class="tab-btn">
      <div class="tab-icon-wrap">
        <ion-icon name="cube-outline"></ion-icon>
      </div>
      <ion-label>{{ 'NAV.PRODUCTS' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Clients — tous -->
    <ion-tab-button tab="clients" class="tab-btn">
      <div class="tab-icon-wrap">
        <ion-icon name="people-outline"></ion-icon>
      </div>
      <ion-label>{{ 'NAV.CLIENTS' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Menu — pas une route, ouvre le tiroir latéral (main-menu) -->
    <ion-tab-button class="tab-btn" (click)="openMenu()">
      <div class="tab-icon-wrap">
        <ion-icon name="menu-outline"></ion-icon>
      </div>
      <ion-label>{{ 'NAV.MENU' | translate }}</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
