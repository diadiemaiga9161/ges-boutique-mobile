<ion-app>

  <!-- ══════════════════ SIDEBAR MENU (design commun ≡ DrawerContent RN) ══════════════════ -->
  <ion-menu menuId="main-menu" contentId="main-content" type="overlay" class="gl-menu">

    <!-- En-tête : bandeau dégradé, marque, utilisateur / rôle, cloche -->
    <ion-header class="ion-no-border">
      <div class="menu-header">
        <div class="menu-header__deco"></div>

        <div class="menu-brand">
          <div class="menu-brand__logo">
            <img src="assets/icon/favicon.png" alt="Ges Lafia" class="menu-brand__img" />
          </div>
          <div class="menu-brand__text">
            <p class="menu-app-name">Ges Lafia</p>
            <p class="menu-app-sub">Maïga Consulting</p>
          </div>
        </div>

        <div class="menu-user">
          <div class="menu-avatar">
            <img *ngIf="userPhoto" [src]="userPhoto" alt="photo" class="menu-avatar-img" />
            <ion-icon *ngIf="!userPhoto" name="person-outline"></ion-icon>
          </div>
          <div class="menu-user-info">
            <p class="menu-username">{{ getUserName() }}</p>
            <span class="menu-role" *ngIf="getRole()">{{ getRole() }}</span>
          </div>
          <!-- Cloche notification -->
          <button type="button" class="menu-notif-bell" *ngIf="auth.isAdmin()" (click)="navigate('/tabs/notifications')" aria-label="Notifications">
            <ion-icon name="notifications-outline"></ion-icon>
            <span class="menu-notif-badge" *ngIf="(notifService.count$ | async) as c">
              {{ c > 99 ? '99+' : c }}
            </span>
          </button>
        </div>

        <!-- Indicateur WebSocket -->
        <div class="ws-indicator" *ngIf="(ws.status$ | async) as status">
          <span class="ws-dot"
            [class.ws-connected]="status === 'connected'"
            [class.ws-connecting]="status === 'connecting'"
            [class.ws-disconnected]="status === 'disconnected'">
          </span>
          <span class="ws-label">
            {{ status === 'connected' ? ('MENU.CONNECTED' | translate) : status === 'connecting' ? ('MENU.CONNECTING' | translate) : ('MENU.OFFLINE' | translate) }}
          </span>
        </div>
      </div>
    </ion-header>

    <ion-content class="menu-content">
      <nav class="menu-list">

        <!-- Contenu piloté par src/app/config/menu-items.config.ts — voir
             AppComponent.visibleMenuSections (canShowMenuItem est l'unique
             source de vérité de visibilité, plus de *ngIf recopié par item). -->
        <!-- trackBy obligatoire : visibleMenuSections renvoie de nouveaux objets à chaque
             détection de changements ; sans trackBy, Angular recrée toutes les lignes,
             chaque routerLinkActive recréé relance une détection → boucle infinie qui
             fige l'appli (constaté sur la page de connexion). -->
        <ng-container *ngFor="let section of visibleMenuSections; let first = first; trackBy: trackMenuSection">
          <div class="menu-divider" *ngIf="!first"></div>
          <p class="menu-section-label" *ngIf="section.labelKey">{{ section.labelKey | translate }}</p>

          <!-- routerLinkActive : surligne l'entrée de la page courante (lien caché,
               affichage seulement — la navigation reste navigate(item.route)). -->
          <button type="button" class="menu-item"
            *ngFor="let item of section.items; trackBy: trackMenuItem"
            routerLinkActive="menu-item--active"
            (click)="navigate(item.route)">
            <span [routerLink]="item.route" hidden aria-hidden="true" tabindex="-1"></span>
            <ion-icon class="menu-item__icon" [name]="item.icon" [class.menu-item__icon--danger]="item.iconColor === 'danger'"></ion-icon>
            <span class="menu-item__label">{{ item.titleKey ? (item.titleKey | translate) : item.title }}</span>
            <span class="menu-item__badge" *ngIf="item.showNotificationBadge && (notifService.count$ | async) as c">
              {{ c > 99 ? '99+' : c }}
            </span>
          </button>
        </ng-container>

      </nav>

      <div class="menu-footer">
        <a href="https://wa.me/22353417919" target="_blank" rel="noopener" class="menu-whatsapp-btn">
          <ion-icon name="logo-whatsapp"></ion-icon>
          {{ 'MENU.CONTACT_WA' | translate }}
        </a>
        <button type="button" class="menu-logout-btn" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
          {{ 'MENU.LOGOUT' | translate }}
        </button>
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <!-- Statut Offline -->
  <app-offline-status></app-offline-status>

  <!-- Bannière PWA -->
  <app-pwa-install></app-pwa-install>

  <!-- Tutoriel d'accueil vendeur (premier login vendeur, ou réouverture manuelle) -->
  <app-tutoriel-vendeur></app-tutoriel-vendeur>

</ion-app>
